#Allows this client to show system MessageBox dialogs requested by a server command.
enableSystemDialogs = true
#Allows this client to show OS notification/toast effects requested by a server command.
enableSystemToasts = true
#Maximum accepted title length for system interactions. Longer titles are truncated client-side and server-side.
# Default: 120
# Range: 1 ~ 512
maxTitleLength = 120
#Maximum accepted message length for system interactions. Longer messages are truncated client-side and server-side.
# Default: 1000
# Range: 1 ~ 4096
maxMessageLength = 1000
#Client-side cooldown between system dialogs, in milliseconds. Prevents accidental message-box spam.
# Default: 1000
# Range: 0 ~ 60000
dialogCooldownMs = 1000
#Client-side cooldown between toast/notification effects, in milliseconds.
# Default: 500
# Range: 0 ~ 60000
toastCooldownMs = 500
